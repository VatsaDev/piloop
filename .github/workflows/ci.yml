name: CI

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_call: {}

env:
  COLUMNS: 150
  UV_FROZEN: "1"
  UV_PYTHON_PREFERENCE: only-managed

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint and install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true
          cache-suffix: lint
      - run: uv sync
      - uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files --verbose
        env:
          SKIP: no-commit-to-branch
          UV_NO_SYNC: "1"
      - run: git config --global user.name piloop-ci && git config --global user.email ci@piloop
      - run: PILOOP_SRC=. ./install.sh
      - name: enwik8 example, headless (no Herdr on a runner)
        env:
          PILOOP_CAMPAIGN_RUNTIME: subprocess
          COLUMNS: 200
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          piloop init --example enwik8 /tmp/enwik8 | tee /tmp/init.txt
          grep -q "registered; baseline candidate#1" /tmp/init.txt
          piloop status enwik8
      - name: the example plugins install next to piloop and are selected through the configuration
        env:
          PILOOP_HOME: /tmp/plugins-home
          PILOOP_CAMPAIGN_RUNTIME: nice
          PILOOP_CAMPAIGN_PLUGINS__VERDICT_RULE__PROVIDER: min_gain
          PILOOP_CAMPAIGN_PLUGINS__VERDICT_RULE__MIN_GAIN: "100"
          PILOOP_CAMPAIGN_PLUGINS__STOP_RULE__PROVIDER: after_keeps
          PILOOP_CAMPAIGN_PLUGINS__STOP_RULE__KEEPS: "3"
          COLUMNS: 200
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv tool install --force --from . piloop $(printf -- '--with ./%s ' examples/plugins/*/)
          mkdir -p "$PILOOP_HOME" && printf '[storage.remote]\nkind = "dir"\nroot = "/tmp/plugins-store"\n' > "$PILOOP_HOME/config.toml"
          piloop serve --check
          piloop init --example enwik8 /tmp/enwik8-nice
          piloop plugins | tee /tmp/plugins.txt
          grep -q "nice        piloop-nice 0.1.0, entry point nice = piloop_nice:NiceRuntime" /tmp/plugins.txt
          grep -q "enwik8 implementer: runtime nice, from piloop-nice 0.1.0" /tmp/plugins.txt
          grep -q "remote backend dir, from piloop-dir-store 0.1.0" /tmp/plugins.txt
          grep -q "enwik8: verdict rule min_gain, from piloop-min-gain 0.1.0" /tmp/plugins.txt
          grep -q "enwik8: stop rule after_keeps, from piloop-stop-after-keeps 0.1.0" /tmp/plugins.txt
          grep -q "verdict checks (pure tier, piloop_verdict_checks.checks):" /tmp/plugins.txt
          grep -q "no_unit_regression  piloop-no-unit-regression 0.1.0" /tmp/plugins.txt
      - name: the wheel carries the skills (a stand-in codex on PATH)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p /tmp/bin && printf '#!/bin/sh\n' > /tmp/bin/codex && chmod +x /tmp/bin/codex
          PATH="/tmp/bin:$PATH" piloop install-skills
          test -f ~/.agents/skills/piloop-operate/SKILL.md

  test:
    name: test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        exclude:
          - os: ${{ github.repository != 'hiloopai/piloop' && 'macos-latest' || 'none' }}
        include:
          - os: ubuntu-latest
            make: testcov
            # Two vCPUs; the tests wait on subprocesses, so four pytest workers finish sooner than two.
            workers: 4
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true
          cache-suffix: test
      - run: uv sync
      - run: make ${{ matrix.make || 'test' }}
        env:
          PYTEST_XDIST_AUTO_NUM_WORKERS: ${{ matrix.workers }}

  check:
    if: always()
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
