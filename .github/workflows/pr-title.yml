# A pull request's title becomes its squash commit subject, and so a line of the release notes. This check renders the
# title with cliff.toml, as `make changelog` does: a title that is not a Conventional Commit of an allowed type fails.
name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

env:
  UV_FROZEN: "1"
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - name: The title is a Conventional Commit of an allowed type
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          git -c user.name=ci -c user.email=ci@localhost commit --allow-empty --quiet --message "$TITLE"
          uv run --only-group release git-cliff HEAD^..HEAD || {
            echo "::error::The PR title is not a Conventional Commit of a type that CONTRIBUTING.md allows: $TITLE"
            exit 1
          }
