# piloop project config. This file lists every key. A key that is set shows its default, unless its comment says
# otherwise. A commented key or table is optional, and its default is to leave it out.
# Reference: https://piloop.autoresearch.inc/reference/configuration
# `piloop init` stores this file, and the daemon uses that copy: run `piloop init` again after each edit.
# PILOOP_PROJECT_<KEY> overrides a key when `piloop init` reads the file. Join nested keys with __.

name = "my-project"                       # required; short identifier; piloop names git refs and the Herdr workspace after it
evaluate = ["uv", "run", "python", "evaluate.py"]  # required; run in a clean worktree of each commit; prints METRIC lines
evaluate_timeout = 600                    # seconds; a slower evaluation is stopped and recorded as a crash
runtime = "subprocess"                    # subprocess: a background process per agent · herdr: a pane per agent · or a package's runtime
harnesses = ["pi", "claude", "codex"]     # not the default, which is ["pi"]; runs use these in turn, unless an idea names one
link = []                                 # gitignored paths to symlink into every worktree, for example "data" or ".venv"
context = []                              # analysis files that every sweep reads first, for example ["docs/error-analysis.md"]
confidence = 0.95                         # a keep needs the primary metric's gain to be above zero at this confidence

[model]                                   # required; the model for each harness, in that harness's own naming
pi = "anthropic/claude-opus-5-5"
claude = "claude-opus-5-5"
codex = "gpt-6.1-sol"

[max_concurrent]                          # the most agents of one harness at the same time, all roles together; e.g. claude = 2

# [harness.<name>]                        # overrides a built-in harness (pi, claude, codex), or defines a new one
# executable = "my-agent"                 # keys: executable, interactive, headless, resume, startup_dialogs,
# headless = ["--model", "{model}", "{prompt}"]  # entire_agent, session_id_pattern, mcp, busy_screens,
#                                         # failed_turn_screens, queue_key (with key and pending), composer,
#                                         # and [harness.<name>.usage] with reader, file, cwd and tally; see the reference

# [mcp.exa]                               # an MCP server that a role can list in its `mcp` key; see the MCP servers guide
# url = "https://mcp.exa.ai/mcp"          # a streamable HTTP server (keys: url, headers_env, bearer_token_env)
# headers_env = { "x-api-key" = "EXA_API_KEY" }  # the header gets the value of this variable from the daemon's environment
# command = ["python3", "server.py"]      # or a stdio server (keys: command, env)
# env = ["XAI_API_KEY"]                   # the variables that a stdio server reads

[roles.worker]                            # a worker tries one idea in a new worktree; its commits are scored
runs = true                               # its agents do runs; a sweeping role has runs = false
# takes = "priority < 3"                  # the ideas it takes: an SQL condition on the ideas table; if not set: every one
# harnesses = ["pi", "claude", "codex"]   # if not set: the project's harnesses
# model = { pi = "..." }                  # merged over [model]
# addendum = "briefs/worker.md"           # a file appended to brief.md in this role's briefs only
# mcp = ["exa"]                           # the [mcp.<name>] servers that this role's agents get; none by default
# prompt = "briefs/my-worker.md"          # a file that replaces the built-in start of this role's brief
# runtime = "herdr"                       # if not set: the project's runtime
# writes = ["commits"]                    # what the brief says the role may write; default: what piloop expects of it
# files = "nothing"                       # what its agents may file with `piloop idea`: nothing, seeds or ideas
# wake_budget = 400                       # tokens of the lessons overview that opens the brief; if not set: [memory]'s
timeout = 1800                            # seconds one worker may run
max_concurrent = 4                        # the most runs at the same time; each run is one harness process on this machine
explore_every = 4                         # at least 1 run in 4 starts from a pinned idea, when one is ready; 0 = off
recovery_requeues = 2                     # times an idea is requeued from work a failed worker left uncommitted

[roles.watchdog]                          # a watchdog investigates anomalies and reviews progress every `interval` seconds
# harnesses = ["pi", "claude", "codex"]   # if not set: the project's harnesses
# model = { pi = "..." }                  # merged over [model]
# addendum = "briefs/watchdog.md"         # a file appended to brief.md in this role's briefs only
# mcp = []                                # the [mcp.<name>] servers that this role's agents get; none by default
# prompt = "briefs/my-watchdog.md"        # a file that replaces the built-in start of this role's brief
# runtime = "herdr"                       # if not set: the project's runtime
# writes = ["comments(finding)"]          # what the brief says the role may write; default: what piloop expects of it
# files = "seeds"                         # what its agents may file with `piloop idea`: nothing, seeds or ideas
runs = false                              # a sweeping role: its triggers start it and nothing it commits is scored
triggers = [{ kind = "anomaly" }, { kind = "cron" }, { kind = "stopped" }]  # an anomaly, the timer below, the stop
# workdir = "project"                     # head (the default): a worktree at the head · project: the project checkout
wake_budget = 0                           # the lessons overview is off: the closing review reads the lessons itself
interval = 1800                           # seconds between two progress reviews of the cron trigger; 0 turns it off
# incident_prompt = "briefs/incident.md"  # follows the prompt in a sweep that got anomalies; default: watchdog_incident.md
# routine_prompt = "briefs/review.md"     # follows the prompt in every other sweep; default: watchdog_progress.md
max_ideas = 1                             # new ideas per sweep for a low_water trigger; the watchdog files only seeds
timeout = 600
max_concurrent = 1

[roles.research]                          # research keeps one runnable idea per run slot, plus the `buffer` of low_water
# harnesses = ["pi", "claude", "codex"]   # if not set: the project's harnesses
# model = { pi = "..." }                  # merged over [model]
# addendum = "briefs/research.md"         # a file appended to brief.md in this role's briefs only
# mcp = ["exa"]                           # the [mcp.<name>] servers that this role's agents get; none by default
# prompt = "briefs/my-research.md"        # a file that replaces the built-in start of this role's brief
# runtime = "herdr"                       # if not set: the project's runtime
# writes = ["ideas via idea add"]         # what the brief says the role may write; default: what piloop expects of it
# files = "ideas"                         # what its agents may file with `piloop idea`: nothing, seeds or ideas
runs = false                              # a sweeping role
triggers = [{ kind = "low_water", buffer = 2 }, { kind = "seed" }]  # a short backlog (buffer: ideas beyond one per run slot), a new seed
# workdir = "project"                     # head (the default): a worktree at the head · project: the project checkout
# interval = 0                            # seconds between two sweeps of a cron trigger, if you add one
# wake_budget = 400                       # tokens of the lessons overview that opens the brief; if not set: [memory]'s
# incident_prompt = "briefs/incident.md"  # follows the prompt in a sweep that got anomalies, if you add that trigger
# routine_prompt = "briefs/routine.md"    # follows the prompt in every other sweep; none by default
max_ideas = 1                             # new ideas per sweep, after the seeds; 0 pauses them (proposed)
timeout = 900
max_concurrent = 1                        # sweeps at the same time; more than one duplicate each other's work

[roles.scout]                             # experimental: sweeps that search X, GitHub and arXiv for outside techniques
# harnesses = ["pi", "claude", "codex"]   # if not set: the project's harnesses
# model = { pi = "..." }                  # merged over [model]
# addendum = "briefs/scout.md"            # a file appended to brief.md in this role's briefs only
# mcp = ["xai"]                           # its search tools: an X search server, for example; none by default
# prompt = "briefs/my-scout.md"           # a file that replaces the built-in start of this role's brief
# runtime = "herdr"                       # if not set: the project's runtime
# writes = ["seeds via idea seed"]        # what the brief says the role may write; default: what piloop expects of it
# files = "seeds"                         # what its agents may file with `piloop idea`: nothing, seeds or ideas
runs = false                              # a sweeping role
triggers = [{ kind = "cron" }]            # the timer below
# workdir = "project"                     # head (the default): a worktree at the head · project: the project checkout
interval = 0                              # seconds between two scout sweeps; 0 (the default) turns the scout off
# incident_prompt = "briefs/incident.md"  # follows the prompt in a sweep that got anomalies, if you add that trigger
# routine_prompt = "briefs/routine.md"    # follows the prompt in every other sweep; none by default
seeds = 3                                 # the most seeds one scout sweep may file
# wake_budget = 400                       # tokens of the lessons overview that opens the brief; if not set: [memory]'s
max_ideas = 1                             # new ideas per sweep for a low_water trigger; the scout files only seeds
timeout = 900
max_concurrent = 1

# [roles.reviewer]                        # a role of your own: any new name; it needs a prompt and triggers
# prompt = "briefs/reviewer.md"           # the file that starts its brief
# triggers = [{ kind = "sql", when = "SELECT 1 FROM candidates WHERE project_id = :project AND verdict = 'keep' AND created_at > :since" }]
# max_concurrent = 1                      # it takes every key of [roles.watchdog] except its defaults

# [roles.quick]                           # a role of your own that does runs: any new name with runs = true
# runs = true                             # it takes every key and default of [roles.worker], its prompt included
# takes = "priority >= 3"                 # the ideas it takes; its slots fill before the worker's
# timeout = 300
# max_concurrent = 2

# [plugins.<name>]                        # the provider of a capability that a plugin package adds, by its name
# provider = "<name>"                     # the other keys of the table are its parameters; `piloop plugins` lists them

# [stop]                                  # any one of these ends the campaign; leave the table out to run with no end
# target = 0.85                           # the primary metric at the head reaches this value (one track only)
# max_runs = 200                          # runs of every role that reached the evaluator (a scored commit)
# max_hours = 12                          # hours since the project's first run started
# max_tokens = 50000000                   # tokens that all the agents of the project spent together
# plateau = 50                            # runs counted as for max_runs, since the last keep or reactivation

# [memory]                                # what past campaigns leave for the next ones; see the research memory page
# documents = ["docs/evidence/**/*.md"]   # repo files that `piloop init` and the stop copy into `documents`; default none
# wake_budget = 400                       # tokens of the current lessons that open worker and research briefs; 0 = off

# [spend]                                 # a hard limit in USD on what the campaign costs outside piloop (GPUs, APIs)
# command = ["uv", "run", "scripts/spend.py"]  # prints the spend so far in USD; it gets secrets from the daemon's environment
# notices = [300, 600]                    # piloop posts one inbox note when the spend crosses each value
# limit = 1000                            # above the limit nothing starts; raise it, then run `piloop init` again
# interval = 300                          # seconds between two runs of the command

[[metrics]]                               # one entry for each METRIC <name>=<value> line; one primary for each track
name = "score"
direction = "higher"                      # higher | lower
role = "primary"                          # primary: must beat the head · guardrail · watch (the default)
# track = "score"                         # primaries only; the track this metric decides; default: the metric's name

# [[metrics]]                             # a guardrail may get worse by at most `margin` (else interesting) and never past `floor` (else discard)
# name = "latency_ms"
# direction = "lower"
# role = "guardrail"
# margin = 20                             # in the metric's own units, compared with the run's bar
# floor = 500                             # optional hard limit on the value

# [tracks.<name>]                         # experimental: one table for each track when several metrics are primary
# share = 1                               # the fraction of each role's run slots for this track; shares sum to 1
# addendum = "briefs/speed.md"            # a file appended to the brief of this track's runs
