[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "piloop"
version = "0.2.0"
description = "Autoresearch for any repo: coding agents try ideas, piloop scores every commit and keeps what wins"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Autoresearch, Inc." }]
keywords = ["autoresearch", "agents", "claude-code", "codex", "optimization", "experiments"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development",
]
dependencies = [
    "alembic>=1.16",
    "blake3>=1.0.11",
    "boto3>=1.43.112",
    "cyclopts>=3.20",
    "gitpython>=3.1.45",
    "httpx2>=2.12.0",
    "opentelemetry-exporter-otlp-proto-http>=1.34",
    "opentelemetry-sdk>=1.34",
    "psutil>=7",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "rich>=15.0.0",
    "sqlalchemy>=2.0.41",
    "textual>=8.2,<9",
]

[project.urls]
Homepage = "https://github.com/hiloopai/piloop"
Documentation = "https://piloop.autoresearch.inc"
Changelog = "https://github.com/hiloopai/piloop/blob/main/CHANGELOG.md"
Issues = "https://github.com/hiloopai/piloop/issues"

[project.scripts]
piloop = "piloop.cli.main:main"

# The providers of piloop itself, in the groups that a plugin package uses (piloop.plugins.host).
[project.entry-points."piloop.capabilities"]
runtime = "piloop.plugins.contracts.runtime:RUNTIMES"
storage_backend = "piloop.plugins.contracts.store:STORAGE_BACKENDS"
trigger = "piloop.triggers:TRIGGERS"
role = "piloop.config:ROLES"
verdict_rule = "piloop.plugins.contracts.verdict:VERDICT_RULES"
stop_rule = "piloop.plugins.contracts.stop:STOP_RULES"

[project.entry-points."piloop.runtimes"]
herdr = "piloop.runtime.herdr:HerdrRuntime"
subprocess = "piloop.runtime.subprocess:SubprocessRuntime"

[project.entry-points."piloop.stores"]
s3 = "piloop.store.s3:S3Config"
gcs = "piloop.store.gcs:GcsConfig"

[project.entry-points."piloop.triggers"]
anomaly = "piloop.triggers:AnomalyTrigger"
cron = "piloop.triggers:CronTrigger"
seed = "piloop.triggers:SeedTrigger"
low_water = "piloop.triggers:LowWaterTrigger"
stopped = "piloop.triggers:StoppedTrigger"
sql = "piloop.triggers:SqlTrigger"

[project.entry-points."piloop.verdict_rules"]
bootstrap = "piloop.plugins.builtin.verdict:BOOTSTRAP"

[project.entry-points."piloop.stop_rules"]
limits = "piloop.plugins.builtin.stop:LIMITS"

[project.entry-points."piloop.roles"]
implementer = "piloop.plugins.builtin.roles:IMPLEMENTER"
watchdog = "piloop.plugins.builtin.roles:WATCHDOG"
research = "piloop.plugins.builtin.roles:RESEARCH"
scout = "piloop.plugins.builtin.roles:SCOUT"

[tool.hatch.build.targets.wheel]
packages = ["piloop"]

[tool.hatch.build.targets.wheel.force-include]
# the Agent Skills package at the repo root ships inside the CLI: `piloop install-skills` copies the installed version
"skills" = "piloop/cli/agent_skills"

[tool.uv]
default-groups = ["dev", "lint"]

[project.optional-dependencies]
gcs = ["google-cloud-storage>=3.0"]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.43.112",
    "coverage[toml]>=7.9",
    "dirty-equals>=0.9",
    "google-cloud-storage>=3.0",
    "inline-snapshot>=0.23",
    "moto[s3]>=5.2.4",
    "pytest>=8.4",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.14",
    "pytest-pretty>=1.3",
    "pytest-xdist>=3.8.0",
    "tomli-w>=1.2.0",
]
lint = [
    "pre-commit>=4.2",
    "ruff>=0.12",
    "ty>=0.0.1a",
    "types-psutil>=7.2.2.20260906",
]
# Release-time only, never a dependency of piloop: `make changelog` and the PR title check.
release = ["git-cliff>=2.14.2"]

[tool.ruff]
line-length = 120
target-version = "py314"
include = ["piloop/**/*.py", "tests/**/*.py", "scripts/**/*.py", "examples/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
extend-select = ["Q", "RUF100", "RUF018", "C90", "UP", "I", "D", "PGH003", "B", "SIM", "TID252"]
flake8-quotes = { inline-quotes = "single", multiline-quotes = "double" }
mccabe = { max-complexity = 15 }
ignore = ["D100", "D102", "D104", "D105", "D107"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["piloop"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]
"piloop/db/migrations/**/*.py" = ["D"]
# the re-exports are grouped by capability, not sorted by module
"piloop/capabilities.py" = ["I001"]

[tool.ruff.format]
quote-style = "single"

[tool.ty.environment]
python-version = "3.14"
extra-paths = ["examples/plugins/nice-runtime", "examples/plugins/dir-store", "examples/plugins/min-gain", "examples/plugins/stop-after-keeps", "examples/plugins/verdict-checks", "examples/plugins/no-unit-regression"]

[tool.ty.src]
include = ["piloop", "tests", "scripts", "examples"]
exclude = ["piloop/db/migrations/versions", "piloop/campaign/templates"]  # templates are projects with their own deps

[tool.pytest.ini_options]
testpaths = ["tests"]
# The example plugins import as packages; their entry points register only where a test installs them.
pythonpath = ["examples/plugins/nice-runtime", "examples/plugins/dir-store", "examples/plugins/min-gain", "examples/plugins/stop-after-keeps", "examples/plugins/verdict-checks", "examples/plugins/no-unit-regression"]
# The e2e tests run real agents and cost money: only `make e2e` (`-m e2e`, which overrides this) selects them.
addopts = ["-m", "not e2e"]
markers = [
    "herdr: needs a live Herdr server",
    "e2e: a real campaign with real agents (make e2e)",
    "needs(*tests): skip unless these earlier tests of the module passed (tests/e2e)",
]
xfail_strict = true
filterwarnings = [
    "error",
]

[tool.coverage.run]
data_file = ".coverage/.coverage"
source = ["piloop"]
omit = ["piloop/db/migrations/*", "piloop/__main__.py", "piloop/campaign/templates/*"]
branch = true

[tool.coverage.report]
fail_under = 100
skip_covered = true
show_missing = true
precision = 2
exclude_lines = [
    'pragma: no cover',
    'raise NotImplementedError',
    'if TYPE_CHECKING:',
    '@overload',
    'assert_never\(',
    'if __name__ == .__main__.:',
    '^\s*\.\.\.$',
]

[tool.inline-snapshot]
format-command = "ruff format --stdin-filename {filename}"
