[project]
name = "piloop-pick-by-priority"
version = "0.1.0"
description = "An example pure piloop plugin: it picks the next idea to run, by priority, data in and data out"
requires-python = ">=3.14"
dependencies = []

[project.entry-points."piloop.example.pickers"]
by_priority = "piloop_pick_by_priority:BY_PRIORITY"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
