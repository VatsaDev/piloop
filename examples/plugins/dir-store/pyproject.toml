[project]
name = "piloop-dir-store"
version = "0.1.0"
description = "A piloop storage backend that mirrors the artifact store to a directory, such as a network share"
requires-python = ">=3.14"
dependencies = ["piloop"]

[project.entry-points."piloop.stores"]
dir = "piloop_dir_store:DirConfig"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
