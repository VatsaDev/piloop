[project]
name = "piloop-verdict-checks"
version = "0.1.0"
description = "A piloop verdict rule that declares a capability, verdict checks, and holds back a keep that a check refuses"
requires-python = ">=3.14"
dependencies = ["piloop"]

[project.entry-points."piloop.capabilities"]
verdict_check = "piloop_verdict_checks.contract:VERDICT_CHECKS"

[project.entry-points."piloop.verdict_rules"]
checked = "piloop_verdict_checks:CHECKED"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
